[project]
name = "autoresearch-naval"
version = "0.1.0"
description = "Naval specification generation, validation, and MLX/LoRA research pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "mlx>=0.30.0",
    "mlx-lm==0.31.3",
    "numpy>=2.2.6",
    "pyarrow>=21.0.0",
    "regex>=2025.7.34",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
